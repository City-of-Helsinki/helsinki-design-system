name: build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - development
      - master
      - patchrelease
      - release-*

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read .nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT
        id: nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: setup node ${{ steps.nvmrc.outputs.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: '${{ steps.nvmrc.outputs.NODE_VERSION }}'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
          check-latest: true

      - name: install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: build design tokens package
        run: pnpm build
        working-directory: ./packages/design-tokens

      - name: build core package
        run: pnpm build
        working-directory: ./packages/core
        env:
          FONT_URL: ${{ secrets.FONT_URL }}

      - name: build react package
        run: pnpm build
        working-directory: ./packages/react

      - name: test react package
        run: pnpm test:coverage
        working-directory: ./packages/react

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        continue-on-error: true
        with:
          projectBaseDir: ./packages/react
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: build hds-js package
        run: pnpm build:hds-js
        working-directory: ./packages/react

      - name: build standalone hds-js package
        run: pnpm build:hds-js-standalone
        working-directory: ./packages/react

      - name: build storybook for core
        run: pnpm build-storybook
        working-directory: ./packages/core

      - name: build storybook for react
        run: pnpm build-storybook
        working-directory: ./packages/react
        env:
          FONT_URL: ${{ secrets.FONT_URL }}

      - name: Store all artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ github.sha }}
          path: |
            packages/hds-js/lib
            packages/hds-js/standalone
            packages/design-tokens/lib
            packages/core/lib
            packages/core/storybook-static
            packages/react/lib
            packages/react/storybook-static
          retention-days: 1
          include-hidden-files: true

  run-e2e-tests:
    needs: build
    uses: ./.github/workflows/e2e-tests.yml
    with:
      commit_sha: ${{ github.sha }}

  publish-demo-site-with-storybooks:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/development' || startsWith(github.ref, 'refs/heads/release-'))) ||
      (github.event_name == 'pull_request' && (github.base_ref == 'development' || github.base_ref == 'master'))
    needs: [build, run-e2e-tests]
    uses: ./.github/workflows/publish-demo-site-with-storybooks.yml
    with:
      commit_sha: ${{ github.sha }}
      build_single_version: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'development') }}

    secrets:
      HDSDEMO_SSH_DEPLOY_KEY: ${{ secrets.HDSDEMO_SSH_DEPLOY_KEY }}
      ASKEM_API_KEY: ${{ secrets.ASKEM_API_KEY }}

  validate-release-preflight:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/patchrelease')
    needs: [build, run-e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read .nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT
        id: nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: setup node ${{ steps.nvmrc.outputs.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: '${{ steps.nvmrc.outputs.NODE_VERSION }}'
          registry-url: 'https://registry.npmjs.org'

      - name: Validate changelog and patch branch before npm publish
        run: |
          node scripts/release/validate-release-preflight.mjs \
            ${{ github.ref == 'refs/heads/patchrelease' && '--patch' || '' }}

  publish-npm-packages:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/patchrelease')
    needs: [build, run-e2e-tests, validate-release-preflight]
    uses: ./.github/workflows/publish-npm-packages.yml
    with:
      commit_sha: ${{ github.sha }}
      release_command: ${{ github.ref == 'refs/heads/patchrelease' && 'pnpm release --dist-tag patch' || 'pnpm release' }}
      deprecate_versions: ${{ github.ref == 'refs/heads/master' }}

  publish-site-with-storybooks:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build, run-e2e-tests, publish-npm-packages]
    uses: ./.github/workflows/publish-site-with-storybooks.yml
    with:
      commit_sha: ${{ github.sha }}
    secrets:
      ACTIONS_DEPLOY_KEY: ${{ secrets.ACTIONS_DEPLOY_KEY }}
      ASKEM_API_KEY: ${{ secrets.ASKEM_API_KEY }}

  reconcile-pending-github-release:
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/patchrelease') &&
      needs.publish-npm-packages.result == 'success'
    needs: [publish-npm-packages]
    runs-on: ubuntu-latest
    outputs:
      pending_github_release: ${{ steps.reconcile.outputs.pending_github_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read .nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT
        id: nvmrc

      - name: setup node ${{ steps.nvmrc.outputs.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: '${{ steps.nvmrc.outputs.NODE_VERSION }}'
          registry-url: 'https://registry.npmjs.org'

      - name: Detect missing GitHub Release for published npm versions
        id: reconcile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ needs.publish-npm-packages.outputs.packages_published }}" = "true" ]; then
            echo "pending_github_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION=$(node -p "require('./packages/react/package.json').version")
          TAG="v$VERSION"
          GH_ERR_FILE="$(mktemp)"
          set +e
          gh release view "$TAG" >/dev/null 2>"$GH_ERR_FILE"
          GH_EXIT=$?
          set -e
          if [ "$GH_EXIT" -eq 0 ]; then
            echo "pending_github_release=false" >> "$GITHUB_OUTPUT"
            rm -f "$GH_ERR_FILE"
            exit 0
          fi
          if ! grep -qiE 'not found|HTTP 404|release not found' "$GH_ERR_FILE"; then
            echo "::error::Failed to look up GitHub Release $TAG"
            cat "$GH_ERR_FILE"
            rm -f "$GH_ERR_FILE"
            exit 1
          fi
          rm -f "$GH_ERR_FILE"

          for name in hds-core hds-design-tokens hds-js hds-react; do
            NPM_ERR_FILE="$(mktemp)"
            if npm view "${name}@${VERSION}" version >/dev/null 2>"$NPM_ERR_FILE"; then
              rm -f "$NPM_ERR_FILE"
              continue
            fi
            if grep -qiE 'E404|404 not found|404 Not Found' "$NPM_ERR_FILE"; then
              echo "Package ${name}@${VERSION} not on npm; no pending GitHub Release."
              echo "pending_github_release=false" >> "$GITHUB_OUTPUT"
              rm -f "$NPM_ERR_FILE"
              exit 0
            fi
            echo "::error::npm registry lookup failed for ${name}@${VERSION}"
            cat "$NPM_ERR_FILE"
            rm -f "$NPM_ERR_FILE"
            exit 1
          done

          echo "::notice::Version ${VERSION} is on npm but GitHub Release ${TAG} is missing; will attempt to create the release."
          echo "pending_github_release=true" >> "$GITHUB_OUTPUT"

  create-github-release:
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/patchrelease') &&
      (needs.publish-npm-packages.outputs.packages_published == 'true' ||
        needs.reconcile-pending-github-release.outputs.pending_github_release == 'true')
    needs: [publish-npm-packages, reconcile-pending-github-release]
    uses: ./.github/workflows/create-github-release.yml
    with:
      commit_sha: ${{ github.sha }}
      is_patch: ${{ github.ref == 'refs/heads/patchrelease' }}

  prepend-unreleased-changelog:
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.create-github-release.result == 'success' &&
      needs.create-github-release.outputs.release_created == 'true'
    needs: [create-github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge master into development
        run: |
          git config user.email "hds@hel.fi"
          git config user.name "Github Actions"
          git fetch origin master development
          git checkout development
          git merge origin/master --no-edit

      - name: Prepend unreleased changelog template
        run: node ./scripts/changelog/update-changelog.js

      - name: Commit and push changelog to development
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "CHANGELOG.md unchanged; pushing merge to development only."
          else
            git add CHANGELOG.md
            git commit -m "chore: update changelog"
          fi
          git push origin development

  delete-artifacts-after-success:
    needs: [build, run-e2e-tests, publish-demo-site-with-storybooks, publish-site-with-storybooks, publish-npm-packages]
    if: |
      always() && 
      github.actor != 'dependabot[bot]' &&
      (needs.build.result == 'success') &&  
      (needs.run-e2e-tests.result == 'success') && 
      (needs.publish-demo-site-with-storybooks.result == 'success' || needs.publish-demo-site-with-storybooks.result == 'skipped') && 
      (needs.publish-site-with-storybooks.result == 'success' || needs.publish-site-with-storybooks.result == 'skipped') &&
      (needs.publish-npm-packages.result == 'success' || needs.publish-npm-packages.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts
        uses: actions/github-script@v9
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: `build-${context.sha}`
            });
            
            for (const artifact of artifacts.data.artifacts) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
            }

  delete-patchrelease-branch:
    if: |
      always() &&
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/patchrelease' &&
      needs.publish-npm-packages.result == 'success' &&
      needs.reconcile-pending-github-release.result == 'success' &&
      needs.create-github-release.result != 'failure' &&
      (needs.create-github-release.result == 'success' || needs.create-github-release.result == 'skipped')
    needs: [build, run-e2e-tests, publish-npm-packages, reconcile-pending-github-release, create-github-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Delete patchrelease branch
        run: |
          git config --global user.email "hds@hel.fi"
          git config --global user.name "Github Actions"
          git push origin --delete patchrelease

